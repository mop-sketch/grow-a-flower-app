<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Grow a Flower</title>
    <link rel="stylesheet" type="text/css" href="fonts.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js"></script>
    <script src="game.js"></script>
    <script src="tutorial.js"></script>
    <script src="achievements.js"></script>
    <script src="debug.js"></script>

</head>
<body class="container" >
    <p id="spring1" class="spring1" style="display:none;">⚙</p>
    <p id="spring2" class="spring2" style="display:none;">⚙</p>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <clipPath id="eldritch-eye-clip">
                <path d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z"/>
            </clipPath>
        </defs>
    </svg>
    <div class="eldritch-eye eye1" aria-hidden="true">
        <svg class="eye-shape" viewBox="0 0 100 60">
            <g class="eye-drift">
                <path class="eye-sclera" d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z"/>
                <g clip-path="url(#eldritch-eye-clip)">
                    <g class="eye-look">
                        <circle class="eye-iris" cx="50" cy="30" r="21"/>
                        <circle class="eye-pupil" cx="50" cy="30" r="9.5"/>
                        <circle class="eye-glint" cx="43" cy="23" r="3.4"/>
                        <circle class="eye-glint2" cx="55" cy="34" r="1.4"/>
                    </g>
                </g>
                <path class="eye-rim" d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z" fill="none"/>
            </g>
        </svg>
    </div>
    <div class="eldritch-eye eye2" aria-hidden="true">
        <svg class="eye-shape" viewBox="0 0 100 60">
            <g class="eye-drift">
                <path class="eye-sclera" d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z"/>
                <g clip-path="url(#eldritch-eye-clip)">
                    <g class="eye-look">
                        <circle class="eye-iris" cx="50" cy="30" r="21"/>
                        <circle class="eye-pupil" cx="50" cy="30" r="9.5"/>
                        <circle class="eye-glint" cx="43" cy="23" r="3.4"/>
                        <circle class="eye-glint2" cx="55" cy="34" r="1.4"/>
                    </g>
                </g>
                <path class="eye-rim" d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z" fill="none"/>
            </g>
        </svg>
    </div>
    <div class="eldritch-eye eye3" aria-hidden="true">
        <svg class="eye-shape" viewBox="0 0 100 60">
            <g class="eye-drift">
                <path class="eye-sclera" d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z"/>
                <g clip-path="url(#eldritch-eye-clip)">
                    <g class="eye-look">
                        <circle class="eye-iris" cx="50" cy="30" r="21"/>
                        <circle class="eye-pupil" cx="50" cy="30" r="9.5"/>
                        <circle class="eye-glint" cx="43" cy="23" r="3.4"/>
                        <circle class="eye-glint2" cx="55" cy="34" r="1.4"/>
                    </g>
                </g>
                <path class="eye-rim" d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z" fill="none"/>
            </g>
        </svg>
    </div>
        <div class="eldritch-eye eye4" aria-hidden="true">
        <svg class="eye-shape" viewBox="0 0 100 60">
            <g class="eye-drift">
                <path class="eye-sclera" d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z"/>
                <g clip-path="url(#eldritch-eye-clip)">
                    <g class="eye-look">
                        <circle class="eye-iris" cx="50" cy="30" r="21"/>
                        <circle class="eye-pupil" cx="50" cy="30" r="9.5"/>
                        <circle class="eye-glint" cx="43" cy="23" r="3.4"/>
                        <circle class="eye-glint2" cx="55" cy="34" r="1.4"/>
                    </g>
                </g>
                <path class="eye-rim" d="M2,30 C26,3 74,3 98,30 C74,57 26,57 2,30 Z" fill="none"/>
            </g>
        </svg>
    </div>
    <!-- Reality-cracks: glass-shatter fractures that slowly draw out from the plant
         when the secret plant ends. Hidden unless body has .eldritch-plant + (.spring
         win / .plant-dead loss) — pure CSS gate + recolour, see style.css. Each path
         is pathLength-normalised so one rule draws it (stroke-dashoffset 1 -> 0). -->
    <audio id="win-audio" src="music and images/Winning-sound.mp3"></audio>
    <!-- The secret plant's bloom is an off-tone, unsettling finale (no confetti,
         corrupted win text, glitchy death visuals) — it gets its own sound. -->
    <audio id="secret-win-audio" src="music and images/glitch.mp3"></audio>
    <audio id="dark-audio" src="music and images/Dark-music.mp3" loop></audio>
    <!-- Always-on dark ambience for the secret plant (the music button can't mute this one). -->
    <audio id="ambience-audio" src="music and images/Dark-Ambience.mp3" loop></audio>
    <audio id="music-audio" src="music and images/Peaceful-Music.mp3" loop></audio>
    <audio id="grow-audio" src="music and images/Plant Growing.mp3"></audio>
    <canvas id="confetti-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;"></canvas>
    <h1 class="title" data-text="Grow a Flower">Grow a Flower</h1>
    <div class="flower" id="flower">
        <div class="fertilizer-notification"></div>
        <div class="flower-scale"><img src="flower/Seed.png" alt="Flower" id="flower-image"></div>
    </div>
    <p id="status">Fertilizer is at unsafe levels&#x274C;</p>
    <p id="score">Score: 0 &nbsp;&nbsp; Best: 0</p>
    <div id="controls-container">
        <div class="meters">
            <div class="meter-row">
                <span class="meter-label">Water&#128167;</span>
                <div class="meter-bar"><div class="fertilizer-safe-zone"></div><div id="water-bar" class="meter-fill water-fill" style="width:50%"></div></div>
            </div>
            <div class="meter-row">
                <span class="meter-label">Sunlight&#9728;&#65039;</span>
                <div class="meter-bar"><div class="fertilizer-safe-zone"></div><div id="sun-bar" class="meter-fill sun-fill" style="width:50%"></div></div>
            </div>
            <div id="warmth-row" class="warmth-row">
                <span class="meter-label">Warmth&#128293;&#65039;</span>
                <div class="meter-bar"><div class="fertilizer-safe-zone"></div><div id="warmth-bar" class="meter-fill warmth-fill" style="width:50%"></div></div>
            </div>
            <div class="health-row" id="health-row">
                <span class="health-label">Health&#10084;&#65039;</span>
                <div class="health-bar"><div id="health-bar" class="meter-fill health-fill" style="width:100%"></div></div>
            </div>
        </div>
        <div class="buttons-container">
            <button id="water-btn" class="water-button">Water</button>
            <button id="sun-btn" class="sun-button">Sunlight</button>
            <button id="warmth-btn" class="warmth-button">Warmth</button>
        </div>
        <button id="fertilizer-btn" class="fertilizer-button">Fertilizer</button>
    </div>
    <button id="drain-btn" class="drain-button">Drain</button>
    <!-- Shown only when the secret (eldritch) plant has BLOOMED: a restart CTA
         below the bloomed plant (see body.eldritch-plant.spring in style.css). -->
    <button id="start-over-btn" class="start-over-button">Begin Again</button>
    <div id="upgrade-container" class="upgrade-container">
        <div class="upgrade-menu" id="upgrade-menu">
            <h2 style="margin:0 0 4px 0;text-align:center;">&#127807; Stage Reward!</h2>
            <p style="text-align:center;margin:0 0 8px 0;font-size:13px;color:#7a5c2e;">Choose one upgrade for your plant</p>
            <div class="option-container">
                <div class="upgrade-option" id="upgrade-option"></div>
                <div class="upgrade-option1" id="upgrade-option1"></div>
                <div class="upgrade-option2" id="upgrade-option2"></div>
            </div>
        </div>
    </div>
    <div id="plant-choice-container" class="upgrade-container">
        <div class="upgrade-menu" id="plant-choice-menu">
            <h2 style="margin:0 0 4px 0;text-align:center;">&#127793; Choose Your Next Plant</h2>
            <p id="plant-choice-subtext" style="text-align:center;margin:0 0 8px 0;font-size:13px;color:#7a5c2e;"></p>
            <div class="option-container" style="justify-content:center;gap:6%;">
                <div class="upgrade-option" id="plant-choice-option0"></div>
                <div class="upgrade-option1" id="plant-choice-option1"></div>
            </div>
        </div>
    </div>
    <div id="win-continue-container">
        <button id="keep-playing-btn" class="menu-button"> Keep Playing</button>
        <button id="restart-game-btn" class="menu-button"> Restart Game</button>
    </div>
    <div class="menu-container" id="menu-container">
        <div id="menu" class="menu">
            <div class="menu-title-area">
                <span class="menu-leaf">&#127800;</span>
                <span class="menu-title-text">Grow a Flower</span>
                <span class="menu-leaf">&#127800;</span>
            </div>
            <hr class="menu-divider">
            <button id="how-to-play-btn" class="menu-button">How to Play</button>
            <button id="achievements-btn" class="menu-button">Achievements</button>
            <button id="learn-more-btn" onclick="window.location.href='learn more.html'" class="menu-button">Learn More</button>
            <button id="restart-btn" class="menu-button">Restart</button>
            <button id="lore-btn" class="menu-button">???</button>
        </div>
    </div>
    <button id="main-menu-btn" class="main-menu-button">&equiv;</button>
    <button id="music-btn" onclick="toggleMusic()" class="music-button">&#x1F507;</button>
    <div class="difficulty-container" id="difficulty-container">
        <div class="menu difficulty-menu">
            <div class="menu-title-area">
                <span class="menu-leaf">&#127807;</span>
                <span class="menu-title-text">Choose Difficulty</span>
                <span class="menu-leaf">&#127807;</span>
            </div>
            <hr class="menu-divider">
            <button id="zen-btn" class="menu-button difficulty-button zen">
                <span class="diff-name">&#129496; Zen</span>
                <span class="diff-desc">No pressure &mdash; very hard to fail</span>
            </button>
            <button id="easy-btn" class="menu-button difficulty-button easy">
                <span class="diff-name">&#127793; Easy</span>
                <span class="diff-desc">Gentle pace, forgiving conditions</span>
            </button>
            <button id="medium-btn" class="menu-button difficulty-button medium">
                <span class="diff-name">&#127807; Medium</span>
                <span class="diff-desc">Faster decay, harsher weather &amp; pests</span>
            </button>
            <button id="hard-btn" class="menu-button difficulty-button hard">
                <span class="diff-name">&#127797; Hard</span>
                <span class="diff-desc">Like Medium, but stages take far longer</span>
            </button>
        </div>
    </div>
    <div class="menu-container" id="achievements-container">
        <div id="achievements-panel" class="menu achievements-menu">
            <div class="menu-title-area">
                <span class="menu-leaf">&#127942;</span>
                <span class="menu-title-text">Achievements</span>
                <span class="menu-leaf">&#127942;</span>
            </div>
            <div id="achievements-count" class="achievements-count"></div>
            <hr class="menu-divider">
            <div id="achievements-list" class="achievements-list"></div>
            <button id="achievements-close-btn" class="menu-button"> Close</button>
        </div>
    </div>
    <div id="achievement-toast"></div>
</body>
